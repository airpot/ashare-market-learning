<text x="80" y="829.5" font-size="19" fill="#20344b" textLength="959.8800" lengthAdjust="spacingAndGlyphs">目标 2026-08-25：H−L=871.910−837.120=34.790；|C−O|=|846.000−850.230|=4.230 元/股。</text>
<text x="80" y="870.0" font-size="19" fill="#20344b" textLength="833.7200" lengthAdjust="spacingAndGlyphs">上影 H−max(O,C)=21.680；下影 min(O,C)−L=8.880。三段相加=34.790，与全幅相等。</text>
<text x="80" y="910.5" font-size="19" fill="#20344b" textLength="798.0000" lengthAdjust="spacingAndGlyphs">两根蜡烛共用价格刻度，右侧蓝、金、紫括线分别对应上影、实体、下影；长度可以直接比较。</text>
<text x="80" y="951.0" font-size="19" fill="#20344b" textLength="1250.2000" lengthAdjust="spacingAndGlyphs">青色虚线是 2026-08-24 前收 870.220，不是目标日开盘 850.230。收盘减开盘=-4.230 判断阴阳；收盘减前收=-24.220 判断日涨跌。</text>
<text x="80" y="991.5" font-size="19" fill="#20344b" textLength="1294.2800" lengthAdjust="spacingAndGlyphs">本题条件为上影≥全幅50%且≥实体2倍，截止本日：符合。比例：实体 0.121587，上影 0.623168，下影 0.255246；外形不证明资金意图或反转。</text>
<text x="80" y="1041.0" font-size="20" fill="#087d80" textLength="1120.0000" lengthAdjust="spacingAndGlyphs">检查一问：请指着目标实体与两条影线，逐一报出各自的价格差；再指出前收虚线，说明阴阳与相对前收涨跌为何要分别判断。</text>
<text x="80" y="1086.0" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
