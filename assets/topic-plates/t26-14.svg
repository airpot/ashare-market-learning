<text x="120" y="725.0" font-size="18" fill="#20344b" textLength="534.9600" lengthAdjust="spacingAndGlyphs">锚点取样10根：2026-09-02—2026-09-15；空心蓝点为锚点。</text>
<text x="1120" y="229.0" font-size="19" fill="#2463a0" textLength="195.3200" lengthAdjust="spacingAndGlyphs">先前10根的最高价上沿</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="288.0400" lengthAdjust="spacingAndGlyphs">锚点 2026-09-02：1130.000</text>
<text x="1120" y="314.0" font-size="19" fill="#20344b" textLength="312.3600" lengthAdjust="spacingAndGlyphs">带 [1124.35, 1135.65] 元/股</text>
<text x="1120" y="356.5" font-size="19" fill="#087d80" textLength="312.3600" lengthAdjust="spacingAndGlyphs">截止 2026-09-16：C=1136.010</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="327.5600" lengthAdjust="spacingAndGlyphs">严格比较 C &gt; 1135.650000：符合</text>
<text x="1120" y="441.5" font-size="19" fill="#20344b" textLength="471.2000" lengthAdjust="spacingAndGlyphs">H=1148.880；L=1076.200；触及与收盘越界分开。</text>
<text x="1120" y="484.0" font-size="19" fill="#20344b" textLength="323.0000" lengthAdjust="spacingAndGlyphs">整根缺口：无；该方向越界候选：符合</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1503.2800" lengthAdjust="spacingAndGlyphs">只用此前10根 2026-09-02—2026-09-15；锚点为最早同价日 2026-09-02 的 1130.000。低缘=锚点×0.995=1124.350000，高缘=锚点×1.005=1135.650000。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1092.8800" lengthAdjust="spacingAndGlyphs">蓝带上边是 1135.65，下边是 1124.35 元/股。先用引线和价格轴找到两条边，再看目标收盘在带内、带外还是恰等于边界。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1456.9200" lengthAdjust="spacingAndGlyphs">只在 2026-09-16 收盘截止核查：C=1136.010 &gt; 带外缘 1135.650000：符合；相等不满足严格关系。整根缺口：无；排除该方向整根跳空后，局部候选条件符合。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1214.4800" lengthAdjust="spacingAndGlyphs">H、L表示当日触及范围，C表示收盘位置；两者不能互换。容差不是置信区间，也未证明多次成交密集或经济突破；权益事件与可交易性须另核。</text>
<text x="80" y="1030.5" font-size="20" fill="#087d80" textLength="1138.4000" lengthAdjust="spacingAndGlyphs">检查一问：请指出锚点日、取样10根和截止日；比较当日最高/最低触及与收盘严格越界。若收盘恰等于带外缘，条件是否成立？</text>
<text x="80" y="1075.5" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
