<text x="120" y="725.0" font-size="18" fill="#20344b" textLength="534.9600" lengthAdjust="spacingAndGlyphs">锚点取样10根：2026-08-03—2026-08-14；空心蓝点为锚点。</text>
<rect x="1024.666667" y="293.652969" width="12.000000" height="17.646190" fill="#087d80" id="return-overlap"/>
<text x="1120" y="229.0" font-size="19" fill="#8255a6" textLength="247.0000" lengthAdjust="spacingAndGlyphs">冻结的是突破当时的旧上沿带</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="294.8800" lengthAdjust="spacingAndGlyphs">旧锚点 2026-08-14：135.360</text>
<text x="1120" y="314.0" font-size="19" fill="#20344b" textLength="293.3600" lengthAdjust="spacingAndGlyphs">旧带 [134.6832, 136.0368]</text>
<text x="1120" y="356.5" font-size="19" fill="#b66c08" textLength="452.9600" lengthAdjust="spacingAndGlyphs">突破日 2026-08-17：C=136.760 &gt; 136.0368</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="338.2000" lengthAdjust="spacingAndGlyphs">前收 136.760 &gt; 旧上缘 136.0368</text>
<text x="1120" y="441.5" font-size="19" fill="#087d80" textLength="190.7600" lengthAdjust="spacingAndGlyphs">返回日 2026-08-18</text>
<text x="1120" y="484.0" font-size="19" fill="#087d80" textLength="338.2000" lengthAdjust="spacingAndGlyphs">最低 132.470 ≤ 旧上缘 136.0368</text>
<text x="1120" y="526.5" font-size="19" fill="#087d80" textLength="338.2000" lengthAdjust="spacingAndGlyphs">最高 137.480 ≥ 旧下缘 134.6832</text>
<text x="1120" y="569.0" font-size="19" fill="#20344b" textLength="464.3600" lengthAdjust="spacingAndGlyphs">交叠 [134.6832, 136.0368]；右侧青条为交叠高</text>
<text x="1120" y="597.5" font-size="19" fill="#20344b" textLength="38.0000" lengthAdjust="spacingAndGlyphs">度。</text>
<text x="1120" y="640.0" font-size="19" fill="#52677d" textLength="437.0000" lengthAdjust="spacingAndGlyphs">只确认区间交叠；未用随后数据，不能称回踩成功。</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1409.8000" lengthAdjust="spacingAndGlyphs">旧带只取 2026-08-03—2026-08-14 的10根；高点 2026-08-14 为 135.360，乘0.995与1.005得 [134.683200, 136.036800]。随后不滚动改带。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1392.3200" lengthAdjust="spacingAndGlyphs">2026-08-17 收 136.760 严格高于旧上缘 136.036800，且非向上整根缺口；返回前收 136.760 仍在旧上缘之上。返回日 2026-08-18 不是整根缺口。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1306.4400" lengthAdjust="spacingAndGlyphs">返回区间 [132.470, 137.480] 与旧带交叠：下端=max(L,旧下缘)=134.683200，上端=min(H,旧上缘)=136.036800。下端≤上端才有交叠。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1102.0000" lengthAdjust="spacingAndGlyphs">紫带保持历史锚点不动；目标蜡烛右侧的青条只画出它与旧带共有的价格范围，青条与紫带等高表示整条旧带都在当日触及范围内。</text>
<text x="80" y="1021.5" font-size="19" fill="#20344b" textLength="1280.6000" lengthAdjust="spacingAndGlyphs">本日 C=134.980；此条件不要求收回旧上缘。尚无随后确认，不能把区间接触、收回上缘、后续守住混为一事；将来确认须另定规则并等新完整日线。</text>
<text x="80" y="1071.0" font-size="20" fill="#087d80" textLength="1100.0000" lengthAdjust="spacingAndGlyphs">检查一问：请依次指出旧锚点、突破日、返回日和交叠青条；说明哪一项只证明接触旧带，为什么今天还不能宣布回踩成功？</text>
<text x="80" y="1116.0" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
