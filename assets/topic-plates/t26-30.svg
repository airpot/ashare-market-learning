<text x="120" y="725.0" font-size="18" fill="#20344b" textLength="534.9600" lengthAdjust="spacingAndGlyphs">锚点取样10根：2026-08-04—2026-08-17；空心蓝点为锚点。</text>
<text x="1120" y="229.0" font-size="19" fill="#2463a0" textLength="195.3200" lengthAdjust="spacingAndGlyphs">先前10根的最高价上沿</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="263.7200" lengthAdjust="spacingAndGlyphs">锚点 2026-08-12：72.000</text>
<text x="1120" y="314.0" font-size="19" fill="#20344b" textLength="263.7200" lengthAdjust="spacingAndGlyphs">带 [71.64, 72.36] 元/股</text>
<text x="1120" y="356.5" font-size="19" fill="#087d80" textLength="288.0400" lengthAdjust="spacingAndGlyphs">截止 2026-08-18：C=73.300</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="303.2400" lengthAdjust="spacingAndGlyphs">严格比较 C &gt; 72.360000：符合</text>
<text x="1120" y="441.5" font-size="19" fill="#20344b" textLength="422.5600" lengthAdjust="spacingAndGlyphs">H=76.010；L=68.700；触及与收盘越界分开。</text>
<text x="1120" y="484.0" font-size="19" fill="#20344b" textLength="323.0000" lengthAdjust="spacingAndGlyphs">整根缺口：无；该方向越界候选：符合</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1430.3200" lengthAdjust="spacingAndGlyphs">只用此前10根 2026-08-04—2026-08-17；锚点为最早同价日 2026-08-12 的 72.000。低缘=锚点×0.995=71.640000，高缘=锚点×1.005=72.360000。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1044.2400" lengthAdjust="spacingAndGlyphs">蓝带上边是 72.36，下边是 71.64 元/股。先用引线和价格轴找到两条边，再看目标收盘在带内、带外还是恰等于边界。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1408.2800" lengthAdjust="spacingAndGlyphs">只在 2026-08-18 收盘截止核查：C=73.300 &gt; 带外缘 72.360000：符合；相等不满足严格关系。整根缺口：无；排除该方向整根跳空后，局部候选条件符合。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1214.4800" lengthAdjust="spacingAndGlyphs">H、L表示当日触及范围，C表示收盘位置；两者不能互换。容差不是置信区间，也未证明多次成交密集或经济突破；权益事件与可交易性须另核。</text>
<text x="80" y="1030.5" font-size="20" fill="#087d80" textLength="1138.4000" lengthAdjust="spacingAndGlyphs">检查一问：请指出锚点日、取样10根和截止日；比较当日最高/最低触及与收盘严格越界。若收盘恰等于带外缘，条件是否成立？</text>
<text x="80" y="1075.5" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
