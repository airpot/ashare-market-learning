<text x="120" y="725.0" font-size="18" fill="#20344b" textLength="534.9600" lengthAdjust="spacingAndGlyphs">锚点取样10根：2026-09-08—2026-09-21；空心蓝点为锚点。</text>
<text x="1120" y="229.0" font-size="19" fill="#2463a0" textLength="195.3200" lengthAdjust="spacingAndGlyphs">先前10根的最高价上沿</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="275.8800" lengthAdjust="spacingAndGlyphs">锚点 2026-09-21：958.860</text>
<text x="1120" y="314.0" font-size="19" fill="#20344b" textLength="336.6800" lengthAdjust="spacingAndGlyphs">带 [954.0657, 963.6543] 元/股</text>
<text x="1120" y="356.5" font-size="19" fill="#087d80" textLength="300.2000" lengthAdjust="spacingAndGlyphs">截止 2026-09-22：C=927.720</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="334.4000" lengthAdjust="spacingAndGlyphs">严格比较 C &gt; 963.654300：不符合</text>
<text x="1120" y="441.5" font-size="19" fill="#20344b" textLength="446.8800" lengthAdjust="spacingAndGlyphs">H=974.990；L=921.000；触及与收盘越界分开。</text>
<text x="1120" y="484.0" font-size="19" fill="#20344b" textLength="342.0000" lengthAdjust="spacingAndGlyphs">整根缺口：无；该方向越界候选：不符合</text>
<text x="1120" y="526.5" font-size="19" fill="#b66c08" textLength="456.0000" lengthAdjust="spacingAndGlyphs">请求条件未获选例资格；这里只核查，不当阳性示范。</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1466.8000" lengthAdjust="spacingAndGlyphs">只用此前10根 2026-09-08—2026-09-21；锚点为最早同价日 2026-09-21 的 958.860。低缘=锚点×0.995=954.065700，高缘=锚点×1.005=963.654300。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1117.2000" lengthAdjust="spacingAndGlyphs">蓝带上边是 963.6543，下边是 954.0657 元/股。先用引线和价格轴找到两条边，再看目标收盘在带内、带外还是恰等于边界。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1470.6000" lengthAdjust="spacingAndGlyphs">只在 2026-09-22 收盘截止核查：C=927.720 &gt; 带外缘 963.654300：不符合；相等不满足严格关系。整根缺口：无；排除该方向整根跳空后，局部候选条件不符合。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1214.4800" lengthAdjust="spacingAndGlyphs">H、L表示当日触及范围，C表示收盘位置；两者不能互换。容差不是置信区间，也未证明多次成交密集或经济突破；权益事件与可交易性须另核。</text>
<text x="80" y="1021.5" font-size="19" fill="#20344b" textLength="1233.4800" lengthAdjust="spacingAndGlyphs">替代说明：在既定日期、30根先验窗口和5根后续约束下，未找到满足冻结上沿带的回访候选全部条件的样本；改为边界核查，不能充作阳性实例。</text>
<text x="80" y="1062.0" font-size="19" fill="#20344b" textLength="1107.3200" lengthAdjust="spacingAndGlyphs">截至本题，未取得合格的冻结旧带回访链；图中蓝带只是今日之前10根的上沿，不是捏造的旧突破带。不得把靠近它说成回访成功。</text>
<text x="80" y="1111.5" font-size="20" fill="#087d80" textLength="1138.4000" lengthAdjust="spacingAndGlyphs">检查一问：请指出锚点日、取样10根和截止日；比较当日最高/最低触及与收盘严格越界。若收盘恰等于带外缘，条件是否成立？</text>
<text x="80" y="1156.5" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
