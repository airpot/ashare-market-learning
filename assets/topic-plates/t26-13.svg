<text x="80" y="829.5" font-size="19" fill="#20344b" textLength="1008.5200" lengthAdjust="spacingAndGlyphs">目标 2026-08-27：H−L=1055.000−1033.180=21.820；|C−O|=|1048.000−1045.500|=2.500 元/股。</text>
<text x="80" y="870.0" font-size="19" fill="#20344b" textLength="833.7200" lengthAdjust="spacingAndGlyphs">上影 H−max(O,C)=7.000；下影 min(O,C)−L=12.320。三段相加=21.820，与全幅相等。</text>
<text x="80" y="910.5" font-size="19" fill="#20344b" textLength="798.0000" lengthAdjust="spacingAndGlyphs">两根蜡烛共用价格刻度，右侧蓝、金、紫括线分别对应上影、实体、下影；长度可以直接比较。</text>
<text x="80" y="951.0" font-size="19" fill="#20344b" textLength="1250.2000" lengthAdjust="spacingAndGlyphs">青色虚线是 2026-08-26 前收 1020.000，不是目标日开盘 1045.500。收盘减开盘=2.500 判断阴阳；收盘减前收=28.000 判断日涨跌。</text>
<text x="80" y="991.5" font-size="19" fill="#20344b" textLength="1282.1200" lengthAdjust="spacingAndGlyphs">本题条件为下影≥全幅50%且≥实体2倍，截止本日：符合。比例：实体 0.114574，上影 0.320807，下影 0.56462；外形不证明资金意图或反转。</text>
<text x="80" y="1041.0" font-size="20" fill="#087d80" textLength="1120.0000" lengthAdjust="spacingAndGlyphs">检查一问：请指着目标实体与两条影线，逐一报出各自的价格差；再指出前收虚线，说明阴阳与相对前收涨跌为何要分别判断。</text>
<text x="80" y="1086.0" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
