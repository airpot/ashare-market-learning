<text x="80" y="829.5" font-size="19" fill="#20344b" textLength="899.0800" lengthAdjust="spacingAndGlyphs">目标 2026-09-08：H−L=65.960−64.400=1.560；|C−O|=|64.670−65.960|=1.290 元/股。</text>
<text x="80" y="870.0" font-size="19" fill="#20344b" textLength="809.4000" lengthAdjust="spacingAndGlyphs">上影 H−max(O,C)=0.000；下影 min(O,C)−L=0.270。三段相加=1.560，与全幅相等。</text>
<text x="80" y="910.5" font-size="19" fill="#20344b" textLength="798.0000" lengthAdjust="spacingAndGlyphs">两根蜡烛共用价格刻度，右侧蓝、金、紫括线分别对应上影、实体、下影；长度可以直接比较。</text>
<text x="80" y="951.0" font-size="19" fill="#20344b" textLength="1213.7200" lengthAdjust="spacingAndGlyphs">青色虚线是 2026-09-07 前收 65.300，不是目标日开盘 65.960。收盘减开盘=-1.290 判断阴阳；收盘减前收=-0.630 判断日涨跌。</text>
<text x="80" y="991.5" font-size="19" fill="#20344b" textLength="1496.4400" lengthAdjust="spacingAndGlyphs">只比实体：目标下端 64.670 &lt; 前实体下端 65.180：符合；目标上端 65.960 &gt; 前实体上端 65.300：符合；方向相反：符合。相等只记临界，不能充作严格吞没；影线</text>
<text x="80" y="1020.0" font-size="19" fill="#20344b" textLength="95.0000" lengthAdjust="spacingAndGlyphs">不用包住。</text>
<text x="80" y="1069.5" font-size="20" fill="#087d80" textLength="1120.0000" lengthAdjust="spacingAndGlyphs">检查一问：请指着目标实体与两条影线，逐一报出各自的价格差；再指出前收虚线，说明阴阳与相对前收涨跌为何要分别判断。</text>
<text x="80" y="1114.5" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
