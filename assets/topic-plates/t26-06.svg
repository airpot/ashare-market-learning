<text x="120" y="725.0" font-size="18" fill="#20344b" textLength="534.9600" lengthAdjust="spacingAndGlyphs">锚点取样10根：2026-08-14—2026-08-27；空心蓝点为锚点。</text>
<text x="1120" y="229.0" font-size="19" fill="#2463a0" textLength="195.3200" lengthAdjust="spacingAndGlyphs">先前10根的最高价上沿</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="288.0400" lengthAdjust="spacingAndGlyphs">锚点 2026-08-17：1014.870</text>
<text x="1120" y="314.0" font-size="19" fill="#20344b" textLength="385.3200" lengthAdjust="spacingAndGlyphs">带 [1009.79565, 1019.94435] 元/股</text>
<text x="1120" y="356.5" font-size="19" fill="#087d80" textLength="300.2000" lengthAdjust="spacingAndGlyphs">截止 2026-08-28：C=858.350</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="346.5600" lengthAdjust="spacingAndGlyphs">严格比较 C &gt; 1019.944350：不符合</text>
<text x="1120" y="441.5" font-size="19" fill="#20344b" textLength="446.8800" lengthAdjust="spacingAndGlyphs">H=915.880；L=856.630；触及与收盘越界分开。</text>
<text x="1120" y="484.0" font-size="19" fill="#20344b" textLength="342.0000" lengthAdjust="spacingAndGlyphs">整根缺口：无；该方向越界候选：不符合</text>
<text x="1120" y="526.5" font-size="19" fill="#b66c08" textLength="456.0000" lengthAdjust="spacingAndGlyphs">请求条件未获选例资格；这里只核查，不当阳性示范。</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1503.2800" lengthAdjust="spacingAndGlyphs">只用此前10根 2026-08-14—2026-08-27；锚点为最早同价日 2026-08-17 的 1014.870。低缘=锚点×0.995=1009.795650，高缘=锚点×1.005=1019.944350。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1165.8400" lengthAdjust="spacingAndGlyphs">蓝带上边是 1019.94435，下边是 1009.79565 元/股。先用引线和价格轴找到两条边，再看目标收盘在带内、带外还是恰等于边界。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1482.7600" lengthAdjust="spacingAndGlyphs">只在 2026-08-28 收盘截止核查：C=858.350 &gt; 带外缘 1019.944350：不符合；相等不满足严格关系。整根缺口：无；排除该方向整根跳空后，局部候选条件不符合。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1214.4800" lengthAdjust="spacingAndGlyphs">H、L表示当日触及范围，C表示收盘位置；两者不能互换。容差不是置信区间，也未证明多次成交密集或经济突破；权益事件与可交易性须另核。</text>
<text x="80" y="1021.5" font-size="19" fill="#20344b" textLength="1195.4800" lengthAdjust="spacingAndGlyphs">替代说明：在既定日期、30根先验窗口和5根后续约束下，未找到满足局部上沿越界候选全部条件的样本；改为边界核查，不能充作阳性实例。</text>
<text x="80" y="1071.0" font-size="20" fill="#087d80" textLength="1138.4000" lengthAdjust="spacingAndGlyphs">检查一问：请指出锚点日、取样10根和截止日；比较当日最高/最低触及与收盘严格越界。若收盘恰等于带外缘，条件是否成立？</text>
<text x="80" y="1116.0" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
