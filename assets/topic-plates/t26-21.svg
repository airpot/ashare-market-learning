<text x="80" y="829.5" font-size="19" fill="#20344b" textLength="947.7200" lengthAdjust="spacingAndGlyphs">目标 2026-09-03：H−L=124.860−122.900=1.960；|C−O|=|123.870−123.770|=0.100 元/股。</text>
<text x="80" y="870.0" font-size="19" fill="#20344b" textLength="809.4000" lengthAdjust="spacingAndGlyphs">上影 H−max(O,C)=0.990；下影 min(O,C)−L=0.870。三段相加=1.960，与全幅相等。</text>
<text x="80" y="910.5" font-size="19" fill="#20344b" textLength="798.0000" lengthAdjust="spacingAndGlyphs">两根蜡烛共用价格刻度，右侧蓝、金、紫括线分别对应上影、实体、下影；长度可以直接比较。</text>
<text x="80" y="951.0" font-size="19" fill="#20344b" textLength="1213.7200" lengthAdjust="spacingAndGlyphs">青色虚线是 2026-09-02 前收 122.550，不是目标日开盘 123.770。收盘减开盘=0.100 判断阴阳；收盘减前收=1.320 判断日涨跌。</text>
<text x="80" y="991.5" font-size="19" fill="#20344b" textLength="1263.1200" lengthAdjust="spacingAndGlyphs">本题条件为实体≤全幅15%且全幅&gt;0，截止本日：符合。比例：实体 0.05102，上影 0.505102，下影 0.443878；外形不证明资金意图或反转。</text>
<text x="80" y="1041.0" font-size="20" fill="#087d80" textLength="1120.0000" lengthAdjust="spacingAndGlyphs">检查一问：请指着目标实体与两条影线，逐一报出各自的价格差；再指出前收虚线，说明阴阳与相对前收涨跌为何要分别判断。</text>
