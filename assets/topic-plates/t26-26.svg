<text x="112" y="704.0" font-size="19" fill="#20344b" textLength="519.8400" lengthAdjust="spacingAndGlyphs">基准20根：2026-06-26 至 2026-07-23（排除目标日）</text>
<text x="953.8571428571429" y="646.0" font-size="18" fill="#20344b" textLength="115.2000" lengthAdjust="spacingAndGlyphs">2026-07-24</text>
<text x="1120" y="229.0" font-size="19" fill="#087d80" textLength="195.3200" lengthAdjust="spacingAndGlyphs">青色虚线：前20根均量</text>
<text x="1120" y="271.5" font-size="19" fill="#20344b" textLength="361.0000" lengthAdjust="spacingAndGlyphs">1611499.75 股 = 161.149975 万股</text>
<text x="1120" y="314.0" font-size="19" fill="#b66c08" textLength="212.8000" lengthAdjust="spacingAndGlyphs">今日量 / 此前20根均量</text>
<text x="1120" y="356.5" font-size="19" fill="#20344b" textLength="376.9600" lengthAdjust="spacingAndGlyphs">1224500 / 1611499.75 = 0.759851</text>
<text x="1120" y="399.0" font-size="19" fill="#20344b" textLength="340.4800" lengthAdjust="spacingAndGlyphs">今日量 &lt; 均量；等于归入不低于均量。</text>
<text x="1120" y="441.5" font-size="19" fill="#20344b" textLength="326.0400" lengthAdjust="spacingAndGlyphs">前收 2026-07-23：67.650 元/股</text>
<text x="1120" y="484.0" font-size="19" fill="#20344b" textLength="404.3200" lengthAdjust="spacingAndGlyphs">今日 2026-07-24：O 66.010；C 69.730</text>
<text x="1120" y="526.5" font-size="19" fill="#20344b" textLength="221.9200" lengthAdjust="spacingAndGlyphs">C−前收 = 2.080 元/股</text>
<text x="1120" y="569.0" font-size="19" fill="#52677d" textLength="304.0000" lengthAdjust="spacingAndGlyphs">本课日量相对值不是软件盘中量比。</text>
<text x="80" y="813.0" font-size="23" fill="#2463a0" textLength="184.0000" lengthAdjust="spacingAndGlyphs">把数值对应到图上</text>
<text x="80" y="859.5" font-size="19" fill="#20344b" textLength="1292.7600" lengthAdjust="spacingAndGlyphs">基准窗口 2026-06-26—2026-07-23 共20根；原始量合计 32229995.00 股，除以20得 1611499.75 股。目标量 1224500 股未进入分母。</text>
<text x="80" y="900.0" font-size="19" fill="#20344b" textLength="1320.8800" lengthAdjust="spacingAndGlyphs">纵轴用万股：股数÷10000。青色虚线为此前均量 161.149975 万股；金柱高于虚线表示今日量更大，低于则更小。单位换成万股不改变两者的大小关系。</text>
<text x="80" y="940.5" font-size="19" fill="#20344b" textLength="1088.3200" lengthAdjust="spacingAndGlyphs">目标收盘 69.730 与前收 67.650 比，上涨；今日量/此前均量=0.759851，低于1。价格方向与相对成交量需要分别判断。</text>
<text x="80" y="981.0" font-size="19" fill="#20344b" textLength="1083.0000" lengthAdjust="spacingAndGlyphs">先指出蓝色比较窗口、青色均量线与金色今日柱，再谈量价组合；每笔交易有买卖双方，柱高不证明资金身份、意图或后续涨跌。</text>
<text x="80" y="1030.5" font-size="20" fill="#087d80" textLength="1105.6000" lengthAdjust="spacingAndGlyphs">检查一问：请在图上指出排除今日的20根窗口；用股与万股各算一次均量，说明今日柱与虚线的比较为何不受单位换算影响。</text>
<text x="80" y="1075.5" font-size="17" fill="#52677d" textLength="919.3600" lengthAdjust="spacingAndGlyphs">来源：同题观察前缀（Sina OHLCV，Tencent OHLC交叉核对）；只画截止前数据。图形不是委托、成交或收益证明。</text>
