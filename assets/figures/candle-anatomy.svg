<title id="title">一根 K 线的四个价格</title><desc id="desc">合成完整日线：开盘10、最高11、最低9.8、收盘10.8元每股。实体由开收盘围成，上下影线延伸至最高最低；OHLC不规定日内先后路径。</desc>
