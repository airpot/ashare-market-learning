<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 774" role="img">
<title>三张连续图：用端点资格跟踪中枢移动</title>
<desc>教学关系图：标号间距、时间与价格不按比例，已知关系见注；未给出值的点位未知。</desc>
<rect width="100%" height="100%" fill="#f3f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17283d">
<text x="38" y="35" font-size="24" font-weight="bold">三张连续图：用端点资格跟踪中枢移动</text>
<text x="38" y="62" font-size="15">原创教学图｜历史关系据书，合成算例另标｜坐标不按比例；未标值未知</text>
<g><rect x="32" y="76" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="102" font-size="18" font-weight="bold">例 5 图一｜20–23 延伸，22–31 另分三组</text><rect x="336" y="150" width="576" height="8" fill="#ebc480" fill-opacity=".65"/><rect x="208" y="174" width="576" height="31" fill="#91d3cc" fill-opacity=".58"/><path d="M208 174H784 M400 205H784" fill="none" stroke="#28877e" stroke-dasharray="5 4"/><path d="M80 219 L144 242 L208 174 L272 221 L336 164 L400 205 L464 150 L528 197 L592 162 L656 189 L720 142 L784 158 L848 130 L912 152 L976 118 L1040 135" fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="80" cy="219" r="4" fill="#245776"/><text x="80" y="210" font-size="13" text-anchor="middle" fill="#245776">18</text><circle cx="144" cy="242" r="4" fill="#245776"/><text x="144" y="259" font-size="13" text-anchor="middle" fill="#245776">19≈3404</text><circle cx="208" cy="174" r="4" fill="#245776"/><text x="208" y="165" font-size="13" text-anchor="middle" fill="#245776">20</text><circle cx="272" cy="221" r="4" fill="#245776"/><text x="272" y="238" font-size="13" text-anchor="middle" fill="#245776">21</text><circle cx="336" cy="164" r="4" fill="#245776"/><text x="336" y="155" font-size="13" text-anchor="middle" fill="#245776">22</text><circle cx="400" cy="205" r="4" fill="#245776"/><text x="400" y="222" font-size="13" text-anchor="middle" fill="#245776">23</text><circle cx="464" cy="150" r="4" fill="#245776"/><text x="464" y="141" font-size="13" text-anchor="middle" fill="#245776">24</text><circle cx="528" cy="197" r="4" fill="#245776"/><text x="528" y="214" font-size="13" text-anchor="middle" fill="#245776">25</text><circle cx="592" cy="162" r="4" fill="#245776"/><text x="592" y="153" font-size="13" text-anchor="middle" fill="#245776">26</text><circle cx="656" cy="189" r="4" fill="#245776"/><text x="656" y="206" font-size="13" text-anchor="middle" fill="#245776">27</text><circle cx="720" cy="142" r="4" fill="#245776"/><text x="720" y="133" font-size="13" text-anchor="middle" fill="#245776">28</text><circle cx="784" cy="158" r="4" fill="#12776c"/><text x="784" y="149" font-size="13" text-anchor="middle" fill="#12776c">29 回试</text><circle cx="848" cy="130" r="4" fill="#245776"/><text x="848" y="121" font-size="13" text-anchor="middle" fill="#245776">30</text><circle cx="912" cy="152" r="4" fill="#245776"/><text x="912" y="169" font-size="13" text-anchor="middle" fill="#245776">31</text><circle cx="976" cy="118" r="4" fill="#245776"/><text x="976" y="109" font-size="13" text-anchor="middle" fill="#245776">32</text><circle cx="1040" cy="135" r="4" fill="#245776"/><text x="1040" y="152" font-size="13" text-anchor="middle" fill="#245776">33</text><path d="M336 248v7H528v-7 M528 248v7H720v-7 M720 248v7H912v-7" fill="none" stroke="#a46a20"/><text x="432" y="244" text-anchor="middle" font-size="13">22→25：[23谷,24峰]</text><text x="624" y="244" text-anchor="middle" font-size="13">25→28：[25谷,28峰]</text><text x="816" y="244" text-anchor="middle" font-size="13">28→31：[29谷,30峰]</text><text x="52" y="283" font-size="14">青带：20–23 核 [23谷,20峰]，29 谷在其上。琥珀带：22–31 三组若均合格，交 [29谷,24峰]。</text></g>
<g><rect x="32" y="302" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="328" font-size="18" font-weight="bold">例 5 图二｜两个各自的三买参照</text><rect x="76" y="416.12" width="372.3076923076923" height="4.600000000000023" fill="#91d3cc" fill-opacity=".58"/><rect x="373.84615384615387" y="380.24" width="372.3076923076923" height="5.519999999999982" fill="#91d3cc" fill-opacity=".58"/><path d="M505 418.5H1054" stroke="#a46a20" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1054" y="441" text-anchor="end" font-size="14">24 峰｜图一所示的 22–31 核上沿</text><path d="M1016 380.24H1058" stroke="#8295a8" stroke-dasharray="3 3"/><path d="M76 416.12 L150.46153846153845 430.84 L224.92307692307693 399.56 L299.38461538461536 420.72 L373.84615384615387 380.24 L448.3076923076923 403.24 L522.7692307692307 367.36 L597.2307692307693 385.76 L671.6923076923077 356.32 L746.1538461538462 373.8 L820.6153846153846 341.6 L895.0769230769231 361.0 L969.5384615384615 336.08 L1044 382.08 " fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="76" cy="416.12" r="4" fill="#245776"/><text x="76" y="408.12" font-size="13" text-anchor="middle">28</text><circle cx="150.46153846153845" cy="430.84" r="4" fill="#245776"/><text x="150.46153846153845" y="447.84" font-size="13" text-anchor="middle">29</text><circle cx="224.92307692307693" cy="399.56" r="4" fill="#245776"/><text x="224.92307692307693" y="391.56" font-size="13" text-anchor="middle">30</text><circle cx="299.38461538461536" cy="420.72" r="4" fill="#245776"/><text x="299.38461538461536" y="437.72" font-size="13" text-anchor="middle">31</text><circle cx="373.84615384615387" cy="380.24" r="4" fill="#245776"/><text x="373.84615384615387" y="372.24" font-size="13" text-anchor="middle">32</text><circle cx="448.3076923076923" cy="403.24" r="4" fill="#245776"/><text x="448.3076923076923" y="420.24" font-size="13" text-anchor="middle">33</text><circle cx="522.7692307692307" cy="367.36" r="4" fill="#245776"/><text x="522.7692307692307" y="359.36" font-size="13" text-anchor="middle">34</text><circle cx="597.2307692307693" cy="385.76" r="4" fill="#245776"/><text x="597.2307692307693" y="402.76" font-size="13" text-anchor="middle">35</text><circle cx="671.6923076923077" cy="356.32" r="4" fill="#245776"/><text x="671.6923076923077" y="348.32" font-size="13" text-anchor="middle">36</text><circle cx="746.1538461538462" cy="373.8" r="4" fill="#245776"/><text x="746.1538461538462" y="390.8" font-size="13" text-anchor="middle">37</text><circle cx="820.6153846153846" cy="341.6" r="4" fill="#245776"/><text x="820.6153846153846" y="333.6" font-size="13" text-anchor="middle">38</text><circle cx="895.0769230769231" cy="361.0" r="4" fill="#245776"/><text x="895.0769230769231" y="378.0" font-size="13" text-anchor="middle">39</text><circle cx="969.5384615384615" cy="336.08" r="4" fill="#245776"/><text x="969.5384615384615" y="328.08" font-size="13" text-anchor="middle">40</text><circle cx="1044" cy="382.08" r="4" fill="#245776"/><text x="1044" y="399.08" font-size="13" text-anchor="middle">41</text><text x="52" y="480" font-size="14">33 对 28–31；37 对 32–35。41 谷低于 32 峰（重叠线索），同时高于 24 峰（界外）。</text><text x="52" y="501" font-size="14">41 对 22–31 通过价格检验；三买还须核实合格次级上离，以及首次合格次级回试已完成。</text></g>
<g><rect x="32" y="528" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="554" font-size="18" font-weight="bold">例 5 图三｜两折未重叠，右端暂按未完成</text><rect x="261" y="627" width="779" height="13" fill="#91d3cc" fill-opacity=".58"/><path d="M710 623H900 M817 610H900" stroke="#8295a8" stroke-dasharray="4 4" fill="none"/><path d="M85 674 L261 627 L348 650 L521 600 L631 640 L710 623 L755 631 L817 578 L900 610 L941 594 L994 608 L1040 592" fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="85" cy="674" r="4" fill="#245776"/><text x="85" y="665" font-size="13" text-anchor="middle" fill="#245776">41</text><circle cx="261" cy="627" r="4" fill="#245776"/><text x="261" y="618" font-size="13" text-anchor="middle" fill="#245776">42</text><circle cx="348" cy="650" r="4" fill="#245776"/><text x="348" y="667" font-size="13" text-anchor="middle" fill="#245776">43</text><circle cx="521" cy="600" r="4" fill="#245776"/><text x="521" y="591" font-size="13" text-anchor="middle" fill="#245776">44</text><circle cx="631" cy="640" r="4" fill="#245776"/><text x="631" y="657" font-size="13" text-anchor="middle" fill="#245776">45</text><circle cx="710" cy="623" r="4" fill="#9636a0"/><text x="710" y="612" font-size="13" text-anchor="middle" fill="#9636a0">早峰</text><circle cx="817" cy="578" r="4" fill="#245776"/><text x="817" y="569" font-size="13" text-anchor="middle" fill="#245776">4192.38</text><circle cx="900" cy="610" r="4" fill="#07828b"/><text x="900" y="630" font-size="13" text-anchor="middle" fill="#07828b">后低</text><text x="52" y="726" font-size="15">45 后先见早峰，再上冲至 4192.38。后低仍高于早峰，缺少重叠；围绕 42–45 继续观察，另等终结结构。</text></g>
</g>
</svg>
