<text x="56" y="389" font-size="15" font-weight="bold">回看候选旧框：I → Z2 下沿（低于）　M → Z3 上沿（高于）　P → Z4 上沿（高于）</text>
<text x="56" y="409" font-size="15">Z3：J 低于下沿，反弹越过上沿，K 回到下沿附近且高于 J；M 高于参照带、低于 Z4。</text>
<text x="56" y="429" font-size="15">Z5：P 低于下沿，随后首个反弹顶越过上沿，Q 回到下沿附近且高于 P。</text>
