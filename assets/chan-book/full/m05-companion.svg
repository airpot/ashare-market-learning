<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" role="img" aria-labelledby="m05-title m05-desc">
<title id="m05-title">合成图｜顶分型与底分型互为镜像</title>
<desc id="m05-desc">两个三线小图均无相邻包含。顶的中根高低均最高，底的中根高低均最低。</desc>
<rect x="0" y="0" width="1000" height="363" fill="#f5f9fc" rx="16"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18354b">
<text x="34" y="42" fill="#18354b" font-size="26" font-weight="bold">合成图｜顶分型与底分型互为镜像</text>
<text x="75" y="89" fill="#18354b" font-size="22">顶分型：中根高点、低点均最高</text>
<text x="538" y="89" fill="#18354b" font-size="22">底分型：中根高点、低点均最低</text>
<line x1="500" y1="66" x2="500" y2="315" stroke="#b9ccd3" stroke-width="2"/>
<g id="top">
<rect x="205" y="104" width="92" height="148" fill="#d7ebe5" rx="8"/>
<line x1="106" y1="169" x2="106" y2="229" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="242" y1="121" x2="242" y2="193" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="378" y1="145" x2="378" y2="217" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="117" y="170" fill="#18354b" font-size="17">14</text>
<text x="117" y="235" fill="#18354b" font-size="17">9</text>
<text x="99" y="266" fill="#18354b" font-size="18">1</text>
<text x="253" y="122" fill="#18354b" font-size="17">18</text>
<text x="253" y="199" fill="#18354b" font-size="17">12</text>
<text x="235" y="266" fill="#18354b" font-size="18">2</text>
<text x="389" y="146" fill="#18354b" font-size="17">16</text>
<text x="389" y="223" fill="#18354b" font-size="17">10</text>
<text x="371" y="266" fill="#18354b" font-size="18">3</text>
<text x="76" y="299" fill="#18354b" font-size="19">中根高点 18 是分型的顶。</text>
</g>
<g id="bottom">
<rect x="668" y="104" width="92" height="148" fill="#d7ebe5" rx="8"/>
<line x1="569" y1="133" x2="569" y2="193" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="705" y1="169" x2="705" y2="241" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="841" y1="145" x2="841" y2="217" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="580" y="134" fill="#18354b" font-size="17">17</text>
<text x="580" y="199" fill="#18354b" font-size="17">12</text>
<text x="562" y="266" fill="#18354b" font-size="18">1</text>
<text x="716" y="170" fill="#18354b" font-size="17">14</text>
<text x="716" y="247" fill="#18354b" font-size="17">8</text>
<text x="698" y="266" fill="#18354b" font-size="18">2</text>
<text x="852" y="146" fill="#18354b" font-size="17">16</text>
<text x="852" y="223" fill="#18354b" font-size="17">10</text>
<text x="834" y="266" fill="#18354b" font-size="18">3</text>
<text x="539" y="299" fill="#18354b" font-size="19">中根低点 8 是分型的底。</text>
</g>
<text x="52" y="339" fill="#18354b" font-size="18">高、低两端各自与两邻比较；只有一端满足，不能直接判为该分型。</text>
</g>
</svg>
