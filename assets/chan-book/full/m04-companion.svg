<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 471" role="img" aria-labelledby="m04-title m04-desc">
<title id="m04-title">合成图｜包含方向与四种三线结构</title>
<desc id="m04-desc">两组包含次序、向下合并及四种相邻不包含的高低区间。每个小图单独读。</desc>
<rect x="0" y="0" width="1000" height="471" fill="#f5f9fc" rx="16"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18354b">
<text x="34" y="42" fill="#18354b" font-size="26" font-weight="bold">合成图｜包含方向与四种三线结构</text>
<text x="40" y="81" fill="#18354b" font-size="22">包含：长线在前或在后</text>
<text x="485" y="81" fill="#18354b" font-size="22">向下合并：最高点、最低点各取较低者</text>
<line x1="456" y1="65" x2="456" y2="236" stroke="#b9ccd3" stroke-width="2"/>
<g id="contain-early">
<line x1="70" y1="108" x2="70" y2="174" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="124" y1="130" x2="124" y2="152" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="54" y="207" fill="#18354b" font-size="18">前根包后根</text>
</g>
<g id="contain-late">
<line x1="276" y1="130" x2="276" y2="152" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="330" y1="108" x2="330" y2="174" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="252" y="207" fill="#18354b" font-size="18">后根包前根</text>
</g>
<g id="down-merge">
<line x1="530" y1="123" x2="530" y2="158" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="624" y1="144" x2="624" y2="179" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="718" y1="151" x2="718" y2="172" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="919" y1="151" x2="919" y2="179" stroke="#975b13" stroke-width="7" stroke-linecap="round"/>
<text x="788" y="162" fill="#18354b" font-size="24">→</text>
<line x1="733" y1="151" x2="903" y2="151" stroke="#975b13" stroke-width="1"/>
<line x1="639" y1="179" x2="903" y2="179" stroke="#975b13" stroke-width="1"/>
<text x="488" y="220" fill="#18354b" font-size="17">[14,19]</text>
<text x="583" y="220" fill="#18354b" font-size="17">[11,16]</text>
<text x="680" y="220" fill="#18354b" font-size="17">[12,15]</text>
<text x="887" y="220" fill="#18354b" font-size="17">[11,15]</text>
<text x="486" y="248" fill="#18354b" font-size="18">前两根同降且不包含，合并后两根。</text>
</g>
<line x1="39" y1="266" x2="960" y2="266" stroke="#b9ccd3" stroke-width="2"/>
<text x="40" y="305" fill="#18354b" font-size="22">三根相邻不包含：每一步高低点同升，或同降</text>
<g id="rise">
<rect x="40" y="324" width="216" height="113" fill="#e0eef3" rx="8"/>
<line x1="87" y1="375" x2="87" y2="396" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="147" y1="361" x2="147" y2="382" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="207" y1="347" x2="207" y2="368" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="53" y="427" fill="#18354b" font-size="19">升 → 升：上升</text>
</g>
<g id="top">
<rect x="274" y="324" width="216" height="113" fill="#e0eef3" rx="8"/>
<line x1="321" y1="375" x2="321" y2="396" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="381" y1="347" x2="381" y2="368" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="441" y1="361" x2="441" y2="382" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="287" y="427" fill="#18354b" font-size="19">升 → 降：顶分型</text>
</g>
<g id="fall">
<rect x="508" y="324" width="216" height="113" fill="#e0eef3" rx="8"/>
<line x1="555" y1="347" x2="555" y2="368" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="615" y1="361" x2="615" y2="382" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="675" y1="375" x2="675" y2="396" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="521" y="427" fill="#18354b" font-size="19">降 → 降：下降</text>
</g>
<g id="bottom">
<rect x="742" y="324" width="216" height="113" fill="#e0eef3" rx="8"/>
<line x1="789" y1="347" x2="789" y2="368" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="849" y1="375" x2="849" y2="396" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="909" y1="361" x2="909" y2="382" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="755" y="427" fill="#18354b" font-size="19">降 → 升：底分型</text>
</g>
<text x="40" y="459" fill="#18354b" font-size="17">取高低区间判定；实体颜色在这里不起作用。</text>
</g>
</svg>
