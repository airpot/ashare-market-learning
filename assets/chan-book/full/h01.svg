<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img">
<title>航天机电：同一串端点的两种合法分解</title>
<desc>教学关系图：标号间距、时间与价格不按比例，已知关系见注；未给出值的点位未知。</desc>
<rect width="100%" height="100%" fill="#f3f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17283d">
<text x="38" y="35" font-size="24" font-weight="bold">航天机电：同一串端点的两种合法分解</text>
<text x="38" y="62" font-size="15">原创教学图｜历史关系据书，合成算例另标｜坐标不按比例；未标值未知</text>
<g><rect x="32" y="76" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="102" font-size="18" font-weight="bold">例 1｜历史标号的顺序和边界</text><rect x="767.4285714285714" y="170.8" width="276.57142857142856" height="4.599999999999994" fill="#91d3cc" fill-opacity=".58"/><rect x="905.7142857142857" y="170.8" width="138.28571428571433" height="33.119999999999976" fill="#e8ba71" fill-opacity=".58"/><path d="M52 246 H1068" stroke="#d9e2ec"/><path d="M145.14285714285714 139.51999999999998 H352.57142857142856" stroke="#d58530" stroke-width="2" stroke-dasharray="6 5"/><path d="M283.42857142857144 175.4 H629.1428571428571" stroke="#d58530" stroke-width="2" stroke-dasharray="6 5"/><path d="M145.14285714285714 139.51999999999998 L214.28571428571428 129.39999999999998 L283.42857142857144 175.4 L352.57142857142856 139.51999999999998 L421.7142857142857 203.92 L490.85714285714283 161.6 L560 211.28 L629.1428571428571 175.4 L698.2857142857143 207.6 L767.4285714285714 170.8 L836.5714285714286 214.04 L905.7142857142857 191.96 L974.8571428571429 222.32 L1044 198.4 " fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><path d="M177 134 H267" stroke="#8295a8" stroke-dasharray="3 4"/><text x="273" y="131" font-size="12">18.50 参照</text><text x="52" y="259" font-size="13">正文暂设 g0＝18.5 元；原图未标 g0，18.59 是另标的高点。可见 g1 峰高于 18.50；未标 g1 报价。</text><circle cx="145.14285714285714" cy="139.51999999999998" r="4" fill="#245776"/><text x="145.14285714285714" y="156.51999999999998" font-size="13" text-anchor="middle">d1</text><circle cx="214.28571428571428" cy="129.39999999999998" r="4" fill="#245776"/><text x="214.28571428571428" y="121.39999999999998" font-size="13" text-anchor="middle">g1</text><circle cx="283.42857142857144" cy="175.4" r="4" fill="#245776"/><text x="283.42857142857144" y="192.4" font-size="13" text-anchor="middle">d2</text><circle cx="352.57142857142856" cy="139.51999999999998" r="4" fill="#245776"/><text x="352.57142857142856" y="131.51999999999998" font-size="13" text-anchor="middle">g2</text><circle cx="421.7142857142857" cy="203.92" r="4" fill="#245776"/><text x="421.7142857142857" y="220.92" font-size="13" text-anchor="middle">d3</text><circle cx="490.85714285714283" cy="161.6" r="4" fill="#245776"/><text x="490.85714285714283" y="153.6" font-size="13" text-anchor="middle">g3</text><circle cx="560" cy="211.28" r="4" fill="#245776"/><text x="560" y="228.28" font-size="13" text-anchor="middle">d4</text><circle cx="629.1428571428571" cy="175.4" r="4" fill="#245776"/><text x="629.1428571428571" y="167.4" font-size="13" text-anchor="middle">g4</text><circle cx="698.2857142857143" cy="207.6" r="4" fill="#245776"/><text x="698.2857142857143" y="224.6" font-size="13" text-anchor="middle">d5</text><circle cx="767.4285714285714" cy="170.8" r="4" fill="#245776"/><text x="767.4285714285714" y="162.8" font-size="13" text-anchor="middle">g5</text><circle cx="836.5714285714286" cy="214.04" r="4" fill="#245776"/><text x="836.5714285714286" y="231.04" font-size="13" text-anchor="middle">d6</text><circle cx="905.7142857142857" cy="191.96" r="4" fill="#245776"/><text x="905.7142857142857" y="183.96" font-size="13" text-anchor="middle">g6</text><circle cx="974.8571428571429" cy="222.32" r="4" fill="#245776"/><text x="974.8571428571429" y="239.32" font-size="13" text-anchor="middle">d7</text><circle cx="1044" cy="198.4" r="4" fill="#245776"/><text x="1044" y="190.4" font-size="13" text-anchor="middle">g7</text><g id="g7-doji-example"><rect x="754" y="109" width="290" height="38" rx="5" fill="#f3f7fb" stroke="#cfdae5"/><text x="765" y="133" font-size="13">g7 附近｜书述两个小十字星（示意）</text><path id="g7-doji-5" d="M1009 123v10m-4-5h8" fill="none" stroke="#24648d" stroke-width="1.5"/><path id="g7-doji-6" d="M1025 123v10m-4-5h8" fill="none" stroke="#24648d" stroke-width="1.5"/></g><text x="52" y="277" font-size="15">橙线示原书条件：d1＝g2、d2＝g4。末次反抽 g7 低于 d2，但可触及 d3。</text></g>
<g><rect x="32" y="302" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="328" font-size="18" font-weight="bold">合成｜同一个反抽高 18.25，分别对照甲与乙</text><rect x="76.0" y="393.8" width="363.0" height="7.74" fill="#91d3cc" fill-opacity=".58"/><rect x="681.0" y="393.8" width="363.0" height="30.1" fill="#e8ba71" fill-opacity=".58"/><path d="M52 474 H1068" stroke="#d9e2ec"/><path d="M76.0 401.54 L197.0 437.66 L318.0 417.88 L439.0 436.8 M681.0 401.54 L802.0 437.66 L923.0 417.88 L1044.0 436.8" fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="76.0" cy="401.54" r="4" fill="#245776"/><text x="76.0" y="393.54" font-size="13" text-anchor="middle">下离开</text><circle cx="197.0" cy="437.66" r="4" fill="#245776"/><text x="197.0" y="453.66" font-size="13" text-anchor="middle">下探</text><circle cx="318.0" cy="417.88" r="4" fill="#245776"/><text x="318.0" y="409.88" font-size="13" text-anchor="middle">18.25</text><circle cx="439.0" cy="436.8" r="4" fill="#245776"/><text x="439.0" y="452.8" font-size="13" text-anchor="middle">回落</text><circle cx="681.0" cy="401.54" r="4" fill="#245776"/><text x="681.0" y="417.54" font-size="13" text-anchor="middle">下离开</text><circle cx="802.0" cy="437.66" r="4" fill="#245776"/><text x="802.0" y="429.66" font-size="13" text-anchor="middle">下探</text><circle cx="923.0" cy="417.88" r="4" fill="#245776"/><text x="923.0" y="433.88" font-size="13" text-anchor="middle">18.25</text><circle cx="1044.0" cy="436.8" r="4" fill="#245776"/><text x="1044.0" y="428.8" font-size="13" text-anchor="middle">回落</text><text x="52" y="500" font-size="15">甲的阴影 [18.30,18.32] 未被触及；乙的阴影 [18.23,18.32] 被反抽触及。</text></g>
<g>
<rect x="32" y="532" width="1056" height="242" rx="12" fill="#fff" stroke="#cfdae5"/>
<text x="52" y="560" font-size="18" font-weight="bold">历史衍生｜三组取全幅，交集才是扩展核</text>
<text x="82" y="590" font-size="16">甲 · 到 g5</text><text x="603" y="590" font-size="16">乙 · 到 g6</text>
<path d="M560 578V732" stroke="#d9e2ec"/>
<rect x="92" y="648" width="440" height="28" fill="#a2d8d2" fill-opacity=".55"/>
<rect x="613" y="648" width="440" height="38" fill="#e8ba71" fill-opacity=".48"/>
<path d="M137 605V676" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="149" y="608" font-size="14">g1</text><text x="149" y="681" font-size="14">d2</text><text x="137" y="730" text-anchor="middle" font-size="14">第 1 组</text><path d="M250 621V697" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="262" y="624" font-size="14">g2</text><text x="262" y="702" font-size="14">d4</text><text x="250" y="730" text-anchor="middle" font-size="14">第 2 组</text><path d="M367 648V697" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="379" y="651" font-size="14">g5</text><text x="379" y="702" font-size="14">d4</text><text x="367" y="730" text-anchor="middle" font-size="14">第 3 组</text>
<path d="M658 621V686" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="670" y="624" font-size="14">g2</text><text x="670" y="691" font-size="14">d3</text><text x="658" y="730" text-anchor="middle" font-size="14">第 1 组</text><path d="M772 633V697" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="784" y="636" font-size="14">g3</text><text x="784" y="702" font-size="14">d4</text><text x="772" y="730" text-anchor="middle" font-size="14">第 2 组</text><path d="M888 648V708" stroke="#24648d" stroke-width="5" stroke-linecap="round"/><text x="900" y="651" font-size="14">g5</text><text x="900" y="713" font-size="14">d6</text><text x="888" y="730" text-anchor="middle" font-size="14">第 3 组</text>
<text x="443" y="667" font-size="15">[d2,g5]</text><text x="963" y="672" font-size="15">[d3,g5]</text>
<text x="52" y="755" font-size="15">竖线两端为组内最低、最高；浅带是三组交集。只示高低关系，纵向距离不是史图报价。</text>
</g>
</g>
</svg>
