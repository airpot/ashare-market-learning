<text x="34" y="39" class="title">同样描述跌后再涨，先算清两个基数</text>
<path d="M80 69V266H884M80 73H884M80 254H884" class="axis dash"/><path d="M144 73L396 254L668 138" class="blue"/><path d="M668 138V73" class="orange dash"/><path d="M391 251L365 244" class="axis"/><text x="84" y="66">旧高 100</text><text x="292" y="250">低点 6</text><text x="680" y="153">反弹至 66</text><text x="185" y="174">跌 94%</text><text x="510" y="243">由 6 涨 1000%</text><text x="685" y="103">仍差 34</text>
