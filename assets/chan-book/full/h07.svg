<text x="205" y="667" font-size="14">71 起上行</text><text x="787" y="589" font-size="14">72</text>
<path d="M198 704H1011" stroke="#8497a6" stroke-dasharray="5 5"/>
<path d="M365 704Q399 703 427 689T489 686Q550 690 577 704Z" fill="#789db4" fill-opacity=".56"/>
<path d="M657 704Q687 703 715 696T786 704Z" fill="#789db4" fill-opacity=".56"/>
<path d="M730 638L748 607M730 723L748 698" stroke="#aa5c35" stroke-width="2.5"/>
<circle cx="748" cy="607" r="4" fill="#aa5c35"/><circle cx="748" cy="698" r="4" fill="#aa5c35"/>
<text x="751" y="647" font-size="14">价图红箭头：末段内的读图位置</text><text x="751" y="720" font-size="14">MACD 红箭头：同一末段的力度线索</text>
<text x="52" y="753" font-size="15">浅棕带只标同一末端窗口，不定逐根对应；柱组轮廓只讲比较方向，原图不足以恢复时戳、参照端点及柱数。</text>
</g>
