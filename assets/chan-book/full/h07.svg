" cy="180" r="4" fill="#245776"/><text x="197" y="196" font-size="13" text-anchor="middle">61</text><circle cx="257.5" cy="162" r="4" fill="#245776"/><text x="257.5" y="153" font-size="13" text-anchor="middle">62</text><circle cx="318" cy="187" r="4" fill="#245776"/><text x="318" y="203" font-size="13" text-anchor="middle">63</text><circle cx="378.5" cy="139" r="4" fill="#245776"/><text x="378.5" y="130" font-size="13" text-anchor="middle">64</text><circle cx="439" cy="190" r="4" fill="#245776"/><text x="439" y="206" font-size="13" text-anchor="middle">65</text><circle cx="499.5" cy="148" r="4" fill="#245776"/><text x="499.5" y="139" font-size="13" text-anchor="middle">66</text><circle cx="560" cy="171" r="4" fill="#245776"/><text x="560" y="187" font-size="13" text-anchor="middle">67</text><circle cx="620.5" cy="137" r="4" fill="#245776"/><text x="620.5" y="128" font-size="13" text-anchor="middle">68</text><circle cx="681" cy="171" r="4" fill="#245776"/><text x="681" y="187" font-size="13" text-anchor="middle">69</text><circle cx="741.5" cy="124" r="4" fill="#245776"/><text x="741.5" y="115" font-size="13" text-anchor="middle">70</text><circle cx="802" cy="142" r="4" fill="#245776"/><text x="802" y="158" font-size="13" text-anchor="middle">71</text><circle cx="862.5" cy="113" r="4" fill="#245776"/><text x="862.5" y="104" font-size="13" text-anchor="middle">72</text><circle cx="923" cy="171" r="4" fill="#245776"/><text x="923" y="187" font-size="13" text-anchor="middle">73</text><circle cx="983.5" cy="146" r="4" fill="#245776"/><text x="983.5" y="137" font-size="13" text-anchor="middle">74</text><circle cx="1044" cy="219" r="4" fill="#245776"/><text x="1044" y="235" font-size="13" text-anchor="middle">后跌</text><text x="52" y="266" font-size="15" >色带自左至右：60–65 取 61 谷至 62 峰；71 高于 66 峰；74 低于 71 谷。</text><text x="52" y="285" font-size="15" >74 低于 72 峰，另核二卖。橙线：69、73 同约 4244；蓝虚线省略折返。</text><text x="652" y="266" font-size="14">68 高于 60、与 64 近高；70 高于这些局部峰。</text><text x="652" y="285" font-size="14">70 进入待查区是原书判读；该层结构前高未能核定。</text></g>
<g><rect x="32" y="302" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="328" font-size="18" font-weight="bold">合成｜四层相对力度与否决分支</text><path d="M52 472 H1068" stroke="#d9e2ec"/><path d="M76 369.2 L172.8 385.76 M366.4 392.2 L463.2 410.6 M656.8 423.48 L753.6 435.44 M947.2 443.72 L1044 447.4 " fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="76" cy="369.2" r="4" fill="#245776"/><text x="76" y="361.2" font-size="13" text-anchor="middle">100</text><circle cx="172.8" cy="385.76" r="4" fill="#245776"/><text x="172.8" y="402.76" font-size="13" text-anchor="middle">80</text><circle cx="366.4" cy="392.2" r="4" fill="#245776"/><text x="366.4" y="409.2" font-size="13" text-anchor="middle">65</text><circle cx="463.2" cy="410.6" r="4" fill="#245776"/><text x="463.2" y="402.6" font-size="13" text-anchor="middle">45</text><circle cx="656.8" cy="423.48" r="4" fill="#245776"/><text x="656.8" y="415.48" font-size="13" text-anchor="middle">31</text><circle cx="753.6" cy="435.44" r="4" fill="#245776"/><text x="753.6" y="452.44" font-size="13" text-anchor="middle">18</text><circle cx="947.2" cy="443.72" r="4" fill="#245776"/><text x="947.2" y="460.72" font-size="13" text-anchor="middle">9</text><circle cx="1044" cy="447.4" r="4" fill="#245776"/><text x="1044" y="439.4" font-size="13" text-anchor="middle">5</text><text x="52" y="500" font-size="15">四层后段均小于前段；第二层后段改到 70 时，即使末层 5＜9，也不能称为四重。</text></g>
<g>
<rect x="32" y="532" width="1056" height="242" rx="12" fill="#fff" stroke="#cfdae5"/>
<text x="52" y="560" font-size="18" font-weight="bold">P73I01 历史衍生｜第四层：对照 71 起的价格末段和 MACD</text>
<rect x="197" y="580" width="814" height="145" fill="#e7f0f6"/>
<rect x="628" y="580" width="295" height="145" fill="#f3dfbc" fill-opacity=".64"/>
<text x="70" y="622" font-size="16">价格示意</text><text x="70" y="698" font-size="16">MACD 柱组</text>
