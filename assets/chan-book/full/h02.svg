<text x="321" y="141" font-size="14" >次绿：A 顶</text>
<text x="668" y="174" font-size="14" text-anchor="middle">B 下行</text>
<text x="52" y="246" font-size="15" >MACD</text>
<text x="80" y="269" font-size="13" >零轴</text>
