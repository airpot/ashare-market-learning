<text x="252" y="324" font-size="14" >指标红①：低开负柱</text>
<text x="838" y="310" font-size="14" >指标红②</text>
<text x="320" y="243" font-size="14" >随后转正</text>
<text x="390" y="289" font-size="14" >小组 1</text>
<text x="527" y="291" font-size="14" >小组 2</text>
<text x="651" y="292" font-size="14" >小组 3</text>
<text x="858" y="283" font-size="14" >末组</text>
<text x="483" y="232" font-size="14" >异号柱看绝对高度，只作辅助</text>
<text x="52" y="350" font-size="15" >③ 缺口段对照 B：只累加各自同向负柱。B 含三小组和末组；图示定性，逐柱截点和面积未知。</text>
</g>
