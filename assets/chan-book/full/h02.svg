<text x="730" y="47" font-size="14" text-anchor="middle">后上</text>
<text x="810" y="74" font-size="14" >比两次上折；后上减弱帮助找结束</text>
<path d="M52 96H1068" fill="none" stroke="#d9e2ec" stroke-width="1" stroke-linejoin="round"/>
