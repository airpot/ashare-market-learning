<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1020" role="img">
<title>五月三十日：低开后怎样识别二卖与新核心</title>
<desc>教学关系图：标号间距、时间与价格不按比例，已知关系见注；未给出值的点位未知。</desc>
<rect width="100%" height="100%" fill="#f3f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17283d">
<text x="38" y="35" font-size="24" font-weight="bold">五月三十日：低开后怎样识别二卖与新核心</text>
<text x="38" y="62" font-size="15">原创教学图｜历史关系据书，合成算例另标｜坐标不按比例；未标值未知</text>
<g>
<rect x="32" y="76" width="1056" height="308" rx="12" fill="#fff" stroke="#cfdae5"/>
<text x="52" y="102" font-size="18" font-weight="bold">例 2｜历史结构：当日依次读五段</text>
<rect x="271" y="173" width="749" height="21" fill="#91d3cc" fill-opacity=".58"/>
<path d="M52 248H1068" stroke="#d9e2ec"/>
<path d="M90 130L271 194" fill="none" stroke="#617d92" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M271 194L449 141L640 217L820 173L1020 201" fill="none" stroke="#24648d" stroke-width="3"/>
<circle cx="90" cy="130" r="4" fill="#245776"/><text x="90" y="118" font-size="14" text-anchor="middle">前日高位</text>
<circle cx="271" cy="194" r="4" fill="#245776"/><text x="271" y="215" font-size="14" text-anchor="middle">低开／首绿箭头</text>
<circle cx="449" cy="141" r="4" fill="#245776"/><text x="449" y="130" font-size="14" text-anchor="middle">A 顶／本例二卖</text>
<circle cx="640" cy="217" r="4" fill="#245776"/><text x="640" y="234" font-size="14" text-anchor="middle">B 底</text>
<circle cx="820" cy="173" r="4" fill="#245776"/><text x="820" y="162" font-size="14" text-anchor="middle">C 顶</text>
<circle cx="1020" cy="201" r="4" fill="#245776"/><text x="1020" y="220" font-size="14" text-anchor="middle">后续下行</text>
<text x="52" y="274" font-size="15">缺口所在首段＋A、B、C＋C 后下行，共五段；只有 A、B、C 参与 [4087,4122] 最初成核。</text>
<text x="52" y="297" font-size="15">常规二卖先核本级一卖；小转大若无本级一卖，先核小级别背驰触发的转折。两路都要查后续次级下跌。</text>
<text x="52" y="320" font-size="15">首个合格次级反抽完成后，按未创新高或可比盘整顶背驰判别。</text>
<text x="52" y="343" font-size="15">5 月 29 日高收时，30 分钟背驰仍未确认。作者称夜间消息确认的是前段背驰；此时已无法按一卖操作。</text>
<text x="52" y="366" font-size="15">盘前预案：若实际大幅低开，开盘后按结构查二卖或三卖；弱股可走三卖。指数 A 顶 9:48 的二卖是开盘后判断。</text>
</g>
<g transform="translate(0 394)">
<rect x="32" y="0" width="1056" height="370" fill="#fff" rx="12" stroke="#cfdae5"/>
<text x="52" y="27" font-size="18" font-weight="bold">P64I01 局部｜分开读三项证据</text>
<text x="52" y="58" font-size="15" font-weight="bold">① A 内部的价格结构（据原书；此行不与下方时轴对齐）</text>
<path d="M570 84L640 58L695 74L771 50" fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/>
