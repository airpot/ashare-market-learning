<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 749" role="img" aria-labelledby="m07-title m07-desc">
<title id="m07-title">补图｜线段起形、编号例与失败分支</title>
<desc id="m07-desc">上、下起段及两种接合为合成示意。编号例依据原书第 10 页 P10I01 重新绘制，只保留相对关系，无历史价位。</desc>
<rect x="0" y="0" width="1000" height="749" fill="#f5f9fc" rx="16"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18354b">
<text x="34" y="42" fill="#18354b" font-size="26" font-weight="bold">补图｜线段起形、编号例与失败分支</text>
<g id="up-start">
<text x="51" y="86" fill="#18354b" font-size="19">上起：首三笔有交集</text>
<polyline points="53,178 74,130 95,154 116,106" fill="none" stroke="#1b637e" stroke-width="3" stroke-linejoin="round"/>
<polyline points="53,178 116,106" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g id="down-start">
<text x="281" y="86" fill="#18354b" font-size="19">下起：首三笔有交集</text>
<polyline points="283,106 304,154 325,130 346,178" fill="none" stroke="#1b637e" stroke-width="3" stroke-linejoin="round"/>
<polyline points="283,106 346,178" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g id="up-then-down">
<text x="528" y="86" fill="#18354b" font-size="19">上接下</text>
<polyline points="530,178 551,130 572,154 593,106 614,142 635,118 656,166" fill="none" stroke="#1b637e" stroke-width="3" stroke-linejoin="round"/>
<polyline points="530,178 593,106" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="593,106 656,166" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g id="down-then-up">
<text x="749" y="86" fill="#18354b" font-size="19">下接上</text>
<polyline points="751,106 772,154 793,130 814,178 835,142 856,166 877,118" fill="none" stroke="#1b637e" stroke-width="3" stroke-linejoin="round"/>
<polyline points="751,106 814,178" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="814,178 877,118" fill="none" stroke="#975b13" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<text x="50" y="213" fill="#18354b" font-size="18">合成起形：橙线表示线段方向；接合外形本身不能证明分界。</text>
<line x1="41" y1="232" x2="960" y2="232" stroke="#b9ccd3" stroke-width="2"/>
<text x="49" y="266" fill="#18354b" font-size="22">原书编号例重绘｜PDF 第 10 页 P10I01（无价格刻度）</text>
<g id="indexed-source">
<rect x="42" y="281" width="918" height="230" fill="#e0eef3" rx="9"/>
<polyline points="62,438 108,396.4 154,406.8 200,354.79999999999995 246,375.6 292,313.2 338,360 384,328.79999999999995 430,391.2 476,344.4 522,406.8 568,292.4 614,432.8 660,370.4 706,479.6 752,412 798,464 844,334 890,396.4 936,282" fill="none" stroke="#1b637e" stroke-width="3.4" stroke-linejoin="round"/>
<polyline points="62,438 292,313.2 706,479.6 936,282" fill="none" stroke="#975b13" stroke-width="2.2" stroke-linejoin="round"/>
<text x="62" y="460" fill="#18354b" font-size="16" text-anchor="middle">1</text>
<text x="108" y="386.4" fill="#18354b" font-size="16" text-anchor="middle">2</text>
<text x="154" y="428.8" fill="#18354b" font-size="16" text-anchor="middle">3</text>
<text x="200" y="344.79999999999995" fill="#18354b" font-size="16" text-anchor="middle">4</text>
<text x="246" y="397.6" fill="#18354b" font-size="16" text-anchor="middle">5</text>
<text x="292" y="303.2" fill="#18354b" font-size="19" text-anchor="middle" font-weight="bold">6</text>
<text x="338" y="382" fill="#18354b" font-size="16" text-anchor="middle">7</text>
<text x="384" y="318.79999999999995" fill="#18354b" font-size="16" text-anchor="middle">8</text>
<text x="430" y="413.2" fill="#18354b" font-size="16" text-anchor="middle">9</text>
<text x="476" y="334.4" fill="#18354b" font-size="16" text-anchor="middle">10</text>
<text x="522" y="428.8" fill="#a83f32" font-size="19" text-anchor="middle" font-weight="bold">11</text>
<text x="568" y="282.4" fill="#18354b" font-size="16" text-anchor="middle">12</text>
<text x="614" y="454.8" fill="#18354b" font-size="16" text-anchor="middle">13</text>
<text x="660" y="360.4" fill="#18354b" font-size="16" text-anchor="middle">14</text>
<text x="706" y="501.6" fill="#18354b" font-size="19" text-anchor="middle" font-weight="bold">15</text>
<text x="752" y="402" fill="#18354b" font-size="16" text-anchor="middle">16</text>
<text x="798" y="486" fill="#18354b" font-size="16" text-anchor="middle">17</text>
<text x="844" y="324" fill="#18354b" font-size="16" text-anchor="middle">18</text>
<text x="890" y="418.4" fill="#18354b" font-size="16" text-anchor="middle">19</text>
<text x="936" y="272" fill="#18354b" font-size="16" text-anchor="middle">20</text>
<circle cx="292" cy="313.2" r="5" fill="#147662"/>
<circle cx="706" cy="479.6" r="5" fill="#147662"/>
<line x1="517" y1="401.8" x2="527" y2="411.8" stroke="#a83f32" stroke-width="3"/>
<line x1="527" y1="401.8" x2="517" y2="411.8" stroke="#a83f32" stroke-width="3"/>
</g>
<text x="52" y="535" fill="#18354b" font-size="18">先验 11：9→10 与 11→12 不跨界合并；后者低端更低、高端反而更高，排除特征底。</text>
<text x="52" y="557" fill="#18354b" font-size="18">排除 11 后，按旧段向下去包含，取点 11 的低、点 10 的高。</text>
<text x="52" y="579" fill="#18354b" font-size="18">橙线分出 1–6、6–15、15–20；图止于 20，不表示已确认下一段。</text>
<line x1="41" y1="588" x2="960" y2="588" stroke="#b9ccd3" stroke-width="2"/>
<g id="no-feature-top">
<text x="52" y="624" fill="#18354b" font-size="22">合成反例｜三个特征元素同升，不构成顶分型</text>
<line x1="560" y1="671" x2="560" y2="695" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="684" y1="659" x2="684" y2="683" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="808" y1="647" x2="808" y2="671" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<text x="547" y="724" fill="#18354b" font-size="18">甲</text>
<text x="671" y="724" fill="#18354b" font-size="18">乙</text>
<text x="795" y="724" fill="#18354b" font-size="18">丙</text>
<text x="52" y="678" fill="#18354b" font-size="18">只见这组三元素时，不据此结束旧上行段。</text>
</g>
</g>
</svg>
