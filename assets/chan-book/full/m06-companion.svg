<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 547" role="img" aria-labelledby="m06-title m06-desc">
<title id="m06-title">合成图｜两种无效连接与候选取舍</title>
<desc id="m06-desc">共享一根与两组紧挨均不成笔；另一个例子保留较高的顶并检验独立根。</desc>
<rect x="0" y="0" width="1000" height="547" fill="#f5f9fc" rx="16"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18354b">
<text x="34" y="42" fill="#18354b" font-size="26" font-weight="bold">合成图｜两种无效连接与候选取舍</text>
<g id="shared">
<text x="55" y="84" fill="#18354b" font-size="22">甲｜第 3 根由两组共用</text>
<rect x="55" y="105" width="169" height="116" fill="#e0eef3" rx="8"/>
<rect x="162" y="115" width="169" height="116" fill="#d7ebe5" rx="8"/>
<rect x="171" y="111" width="34" height="112" fill="#f9ddc4" rx="5"/>
<line x1="79" y1="151" x2="79" y2="179" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
<line x1="133" y1="123" x2="133" y2="158" stroke="#147662" stroke-width="7" stroke-linecap="round"/>
<line x1="187" y1="158" x2="187" y2="200" stroke="#1b637e" stroke-width="7" stroke-linecap="round"/>
