<text x="518" y="279" fill="#18354b" font-size="18">顶 1–3，底 4–6；没有独立根。</text>
</g>
<line x1="40" y1="298" x2="960" y2="298" stroke="#b9ccd3" stroke-width="2"/>
<text x="55" y="331" fill="#18354b" font-size="22">丙｜顶 2 与更高的顶 4 之间，底 3 不够成笔</text>
