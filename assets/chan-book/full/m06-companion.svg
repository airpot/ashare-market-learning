<text x="181" y="250" fill="#18354b" font-size="17">3</text>
<text x="235" y="250" fill="#18354b" font-size="17">4</text>
<text x="289" y="250" fill="#18354b" font-size="17">5</text>
<text x="55" y="279" fill="#18354b" font-size="18">顶 1–3，底 3–5；第 3 根共用。</text>
</g>
<g id="adjacent">
<text x="518" y="84" fill="#18354b" font-size="22">乙｜两组紧挨，没有独立一根</text>
