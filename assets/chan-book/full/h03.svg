e="13" text-anchor="middle">7：3858.72</text><circle cx="850.4" cy="168.4" r="4" fill="#245776"/><text x="850.4" y="160.4" font-size="13" text-anchor="middle">8</text><circle cx="947.2" cy="182.76" r="4" fill="#245776"/><text x="947.2" y="199.76" font-size="13" text-anchor="middle">9</text><circle cx="1044" cy="135.83999999999997" r="4" fill="#245776"/><text x="1044" y="127.83999999999997" font-size="13" text-anchor="middle">10</text><rect x="52" y="258" width="22" height="12" fill="#91d3cc"/><text x="83" y="269" font-size="15">青色：1 分钟旧核 [4087,4122]</text><text x="83" y="285" font-size="14">青色参考线延伸其下沿，5→6 未触</text><text x="328" y="285" font-size="14">8 峰高于 5 谷，低于 6 峰</text><rect x="575" y="258" width="22" height="12" fill="#ebc480"/><text x="607" y="269" font-size="15">琥珀色：5 分钟扩展核 [3谷,4峰]</text><text x="607" y="285" font-size="14">到 10 才确认；原书整数边界 [4015,4122]</text></g>
<g><rect x="32" y="302" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="328" font-size="18" font-weight="bold">合成｜形成核心的三组次级范围</text><rect x="76" y="383.92" width="968" height="40.47999999999996" fill="#91d3cc" fill-opacity=".58"/><path d="M52 472 H1068" stroke="#d9e2ec"/><path d="M76 424.4 L214.28571428571428 370.12 M490.85714285714283 435.44 L629.1428571428571 383.92 M905.7142857142857 429 L1044 355.4 " fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="76" cy="424.4" r="4" fill="#245776"/><text x="76" y="416.4" font-size="13" text-anchor="middle">4015</text><circle cx="214.28571428571428" cy="370.12" r="4" fill="#245776"/><text x="214.28571428571428" y="387.12" font-size="13" text-anchor="middle">4130</text><circle cx="490.85714285714283" cy="435.44" r="4" fill="#245776"/><text x="490.85714285714283" y="452.44" font-size="13" text-anchor="middle">3890</text><circle cx="629.1428571428571" cy="383.92" r="4" fill="#245776"/><text x="629.1428571428571" y="375.92" font-size="13" text-anchor="middle">4122</text><circle cx="905.7142857142857" cy="429" r="4" fill="#245776"/><text x="905.7142857142857" y="421" font-size="13" text-anchor="middle">3960</text><circle cx="1044" cy="355.4" r="4" fill="#245776"/><text x="1044" y="372.4" font-size="13" text-anchor="middle">4200</text><text x="52" y="500" font-size="15">三组取交集：最大低点 4015，最小高点 4122；第三组未完时只记候选。</text></g>
