<rect x="165" y="193" width="170" height="22" fill="#3b947d" fill-opacity=".25"/>
<path d="M540 185H720" stroke="#b25d46" stroke-width="3" stroke-dasharray="7 5"/>
<g text-anchor="middle" font-size="16"><text x="190" y="256">[9,11]</text><text x="310" y="239">[10,13]</text><text x="430" y="253">[9.5,12]</text>
<text x="558" y="253">[9,11]</text><text x="678" y="146">[12,15]</text><text x="810" y="214">[11.5,14]</text></g>
<text x="164" y="294">前两元素交 [10,11]</text><text x="546" y="294">缺口 (11,12)，需反向分型</text>
