<g transform="translate(0 259)"><rect x="32" y="302" width="1056" height="216" rx="12" fill="#fff" stroke="#cfdae5"/><text x="52" y="328" font-size="18" font-weight="bold">合成｜两次上折范围不相交</text><path d="M52 472 H1068" stroke="#d9e2ec"/><path d="M269.6 396.8 H850.4" stroke="#d58530" stroke-width="2" stroke-dasharray="6 5"/><path d="M76 352.64 L269.6 396.8 L463.2 380.24 L656.8 429.92 L850.4 410.6 L1044 443.72 " fill="none" stroke="#24648d" stroke-width="3" stroke-linejoin="round"/><circle cx="76" cy="352.64" r="4" fill="#245776"/><text x="76" y="344.64" font-size="13" text-anchor="middle">120</text><circle cx="269.6" cy="396.8" r="4" fill="#245776"/><text x="269.6" y="413.8" font-size="13" text-anchor="middle">101</text><circle cx="463.2" cy="380.24" r="4" fill="#245776"/><text x="463.2" y="372.24" font-size="13" text-anchor="middle">108</text><circle cx="656.8" cy="429.92" r="4" fill="#245776"/><text x="656.8" y="446.92" font-size="13" text-anchor="middle">88</text><circle cx="850.4" cy="410.6" r="4" fill="#245776"/><text x="850.4" y="402.6" font-size="13" text-anchor="middle">96</text><circle cx="1044" cy="443.72" r="4" fill="#245776"/><text x="1044" y="460.72" font-size="13" text-anchor="middle">78</text><text x="52" y="500" font-size="15">第二上顶 96 低于第一上底 101，所以原样例没有相交；改到 104 则相交。</text></g>
