<g font-size="15"><text x="63" y="287">重叠不一定在早段</text><text x="353" y="287">棕色条隔离两处核心</text><text x="654" y="287">尖峰后也可转向，仍无交集</text></g>
<text x="45" y="348" font-size="17">均用八根高低范围作示意；浅绿带标可核的核心相交区，横向按根数。</text>
