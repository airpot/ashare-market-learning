<text x="1007.50" y="529.00" style="font-size:14px;fill:#8a5090">T5 返回可用</text>
<text x="28.00" y="573.00" style="font-size:17px;fill:#18283b">L2=[max(50,48,50), min(59,57,61)]=[50,57]；输入为 T1—T3 的全范围，不是三个内部核心。</text>
<text x="28.00" y="608.00" style="font-size:17px;fill:#18283b">T4：58→48，q145 完成向下离开。T5：48→60，全范围 [48,63]，q175 完成首次返回。</text>
<text x="28.00" y="643.00" style="font-size:17px;fill:#18283b">返回范围与旧核心相交 [50,57]，高点 63&gt;50 → 本次有限三卖条件失败。</text>
<text x="28.00" y="678.00" style="font-size:16px;fill:#18283b">T5 最早一笔到 q123 已显示越过 50；q175 是完整返回分类时刻，不是首次发现越界的时刻。</text>
<text x="28.00" y="707.00" style="font-size:15px;fill:#18283b">绿带=固定 L2 核心；各灰蓝框=完整 L1 范围；斜线只连接块端点，不能替代框内波动。</text>
