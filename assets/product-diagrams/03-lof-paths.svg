<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-label="LOF 路径：买卖、申赎与转托管" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#24354b">
<title>LOF 路径：买卖、申赎与转托管</title><desc>三种操作分开核对；确认、可用、可卖和可取款是不同状态。</desc>
<rect width="1440" height="920" rx="22" fill="#f2f6fa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7757b5"/></marker></defs>
<text x="62" y="66" font-size="36" font-weight="700">LOF 路径：买卖、申赎与转托管</text>
<text x="62" y="108" font-size="21">三种操作分开核对；确认、可用、可卖和可取款是不同状态。</text>
<path d="M367,326 L367,358" stroke="#7757b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1071,326 L1071,358" stroke="#7757b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M367,546 L367,578" stroke="#7757b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1071,546 L1071,578" stroke="#7757b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="62" y="150" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="86" y="189" font-size="25" font-weight="700" fill="#315e86">01  场内买卖</text>
<text x="86" y="225" font-size="22">按交易所委托规则成交，使用市场价格；份额所在账</text>
<text x="86" y="252" font-size="22">户影响后续操作。</text>
<rect x="766" y="150" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="790" y="189" font-size="25" font-weight="700" fill="#315e86">02  申购赎回</text>
<text x="790" y="225" font-size="22">按合同与业务规则办理；净值日期、确认时点、费用</text>
<text x="790" y="252" font-size="22">和开放状态须核实。</text>
<rect x="62" y="370" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="86" y="409" font-size="25" font-weight="700" fill="#315e86">03  账户与托管位置</text>
<text x="86" y="445" font-size="22">先辨登记系统、销售渠道、证券账户与份额位置，再</text>
<text x="86" y="472" font-size="22">问能否转移。</text>
<rect x="766" y="370" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="790" y="409" font-size="25" font-weight="700" fill="#315e86">04  转托管</text>
<text x="790" y="445" font-size="22">跨系统转移可能需要等待；确认并不自动代表当日可</text>
<text x="790" y="472" font-size="22">卖，须查实际办理状态。</text>
<rect x="62" y="590" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="86" y="629" font-size="25" font-weight="700" fill="#315e86">05  限制与日历</text>
<text x="86" y="665" font-size="22">限购、暂停、恢复、境外休市、资金占用与费用，均</text>
<text x="86" y="692" font-size="22">会改变操作可行性。</text>
<rect x="766" y="590" width="610" height="176" rx="16" fill="white" stroke="#cbd9e7"/>
<text x="790" y="629" font-size="25" font-weight="700" fill="#315e86">06  判断或等待</text>
<text x="790" y="665" font-size="22">净值尚未知、申购暂停或份额未可用时，不能把名义</text>
<text x="790" y="692" font-size="22">折溢价当成无风险利润。</text>
<text x="62" y="828" font-size="21" fill="#526176">本图不给统一到账天数。真实路径必须绑定具体基金、业务日期、公告、渠道和账户状态。</text>
</svg>
